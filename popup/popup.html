<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplyEase</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="glass-card">
      <!-- Header -->
      <div class="header">
        <img class="logo" src="./icon2.png" alt="ApplyEase">
        <div class="brand">
          <div class="brand-name">ApplyEase</div>
          <div class="brand-tagline">Smart Job Application Assistant</div>
        </div>
      </div>

      <!-- Main Actions -->
      <div class="btn-group">
        <button id="auto-fill" class="btn btn-primary">
          <span>✨</span>
          <span>Auto Fill</span>
        </button>
        <button id="open-tracker" class="btn btn-secondary">
          <span>📋</span>
          <span>Tracker</span>
        </button>
      </div>

      <!-- Loading State -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <span id="filling-text">Filling your application...</span>
      </div>

      <!-- Match Panel -->
      <div id="match-panel" class="match-panel">
        <!-- Match Score -->
        <div class="match-header">
          <div class="match-title">Resume Match</div>
          <div class="match-score">
            <span id="match-percent" class="match-percent">0%</span>
          </div>
        </div>
        
        <!-- Progress Bar -->
        <div class="match-bar">
          <div id="match-bar-fill" class="match-bar-fill" style="width: 0%"></div>
        </div>

        <!-- Matching Keywords -->
        <div class="keywords-section">
          <div class="keywords-label">
            <span class="icon">✓</span>
            <span>Matching Skills</span>
          </div>
          <div id="match-matching" class="keywords-list"></div>
        </div>

        <!-- Missing Keywords -->
        <div class="keywords-section">
          <div class="keywords-label">
            <span class="icon">○</span>
            <span>Skills to Highlight</span>
          </div>
          <div id="match-missing" class="keywords-list"></div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">
        <div class="quick-action" id="open-dashboard">
          <div class="quick-action-icon">👤</div>
          <div class="quick-action-label">Profile</div>
        </div>
        <div class="quick-action" id="open-cover-letter">
          <div class="quick-action-icon">📝</div>
          <div class="quick-action-label">Cover Letter</div>
        </div>
        <div class="quick-action" id="open-resume">
          <div class="quick-action-icon">📄</div>
          <div class="quick-action-label">Resume</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="footer-text">Privacy-first • Local AI • No data shared</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
